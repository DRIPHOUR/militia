<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Country Stick Militia - Mobile & Desktop Edition</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body {
      margin: 0;
      background: #0f111a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 { margin: 5px 0; font-size: 22px; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
    #setup, #endScreen {
      background: #1a1d28;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #2e344a;
      max-width: 480px;
      width: 90%;
      z-index: 10;
    }
    .field { margin-bottom: 12px; text-align: left; }
    label { display: block; margin-bottom: 5px; font-size: 13px; color: #a0a6c0; }
    select, input, button {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #2b3044;
      color: #fff;
      outline: none;
    }
    input { text-transform: uppercase; letter-spacing: 2px; text-align: center; font-weight: bold; }
    button {
      background: #4f46e5;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }
    .upgrade-btn { background: #059669; margin-top: 5px; }
    .upgrade-btn:hover { background: #047857; }
    
    #game-container {
      position: relative;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    #ui-bar {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      padding: 5px 15px;
      font-size: 16px;
      font-weight: bold;
      color: #facc15;
    }
    #canvas {
      background: linear-gradient(to bottom, #1b263b, #0d1b2a);
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      touch-action: none;
    }
    #controls-hint { margin-top: 4px; color: #64748b; font-size: 12px; text-align: center; }
    .room-info { background: #111420; padding: 8px; border-radius: 6px; margin: 8px 0; font-size: 22px; color: #22c55e; letter-spacing: 4px; }
    .stats-row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }

    /* Touch Controls Overlay */
    #touchOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: none;
    }
    .touch-zone {
      position: absolute;
      bottom: 20px;
      pointer-events: auto;
    }
    #leftJoystickZone {
      left: 20px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #joystickKnob {
      width: 50px;
      height: 50px;
      background: rgba(79, 70, 229, 0.8);
      border-radius: 50%;
      transform: translate(0px, 0px);
    }
    #fireBtn {
      right: 20px;
      width: 100px;
      height: 100px;
      background: rgba(239, 68, 68, 0.7);
      border: 3px solid #f8fafc;
      border-radius: 50%;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #fireBtn:active { background: rgba(220, 38, 38, 0.9); }
  </style>
</head>
<body>

  <h1>Country Stick Militia</h1>

  <div id="setup">
    <div class="field">
      <label for="deviceSelect">Select Control Type:</label>
      <select id="deviceSelect">
        <option value="desktop">💻 Desktop (Keyboard & Mouse)</option>
        <option value="mobile">📱 Mobile / Tablet (Touchscreen)</option>
      </select>
    </div>

    <div class="field">
      <label for="countrySelect">Select Faction/Country:</label>
      <select id="countrySelect">
        <option value="🇳🇬 Nigeria">🇳🇬 Nigeria</option>
        <option value="🇺🇸 USA">🇺🇸 USA</option>
        <option value="🇬🇧 UK">🇬🇧 UK</option>
        <option value="🇯🇵 Japan">🇯🇵 Japan</option>
        <option value="🇧🇷 Brazil">🇧🇷 Brazil</option>
        <option value="🇩🇪 Germany">🇩🇪 Germany</option>
        <option value="🇨🇦 Canada">🇨🇦 Canada</option>
        <option value="🇫🇷 France">🇫🇷 France</option>
      </select>
    </div>

    <button onclick="hostGame()">Host Game (4-Digit Room)</button>
    <p style="color:#64748b; margin: 8px 0;">— OR —</p>

    <div class="field">
      <label for="joinId">Enter 4-Letter Room Code:</label>
      <input type="text" id="joinId" maxlength="4" placeholder="e.g. X7A2" />
    </div>
    <button onclick="joinGame()" style="background:#059669;">Join Game</button>

    <div id="status" style="margin-top: 12px; color: #facc15; font-size: 13px;"></div>
  </div>

  <div id="game-container">
    <div id="ui-bar">
      <div id="timerDisplay">Time: 05:00</div>
      <div id="scoreDisplay">Kills: 0 / 10</div>
    </div>

    <canvas id="canvas" width="1000" height="550"></canvas>
    <div id="controls-hint">Controls: [A/D or Joystick] Move | [W or Joystick Up] Jetpack | [Mouse/Touch] Aim & Shoot</div>

    <div id="touchOverlay">
      <div id="leftJoystickZone" class="touch-zone">
        <div id="joystickKnob"></div>
      </div>
      <div id="fireBtn" class="touch-zone">FIRE</div>
    </div>
  </div>

  <!-- End Game / Upgrade Menu -->
  <div id="endScreen" style="display:none;">
    <h2 id="winnerText" style="color: #22c55e; margin-top: 0;">Match Finished!</h2>
    <p>Available Upgrade Points: <b id="pointsText" style="color:#facc15;">0</b></p>
    
    <div class="stats-row">
      <span>Damage (+2 per level): <b id="dmgLvl">1</b></span>
      <button class="upgrade-btn" onclick="upgradeStat('damage')">Upgrade Damage</button>
    </div>
    <div class="stats-row">
      <span>Speed (+0.5 per level): <b id="spdLvl">1</b></span>
      <button class="upgrade-btn" onclick="upgradeStat('speed')">Upgrade Speed</button>
    </div>
    <div class="stats-row">
      <span>Max Health (+15 per level): <b id="hpLvl">1</b></span>
      <button class="upgrade-btn" onclick="upgradeStat('health')">Upgrade Health</button>
    </div>

    <button onclick="restartMatch()" style="margin-top: 15px; background: #3b82f6;">Play Next Match</button>
  </div>

  <script>
    const PEER_PREFIX = 'csm-v3-';
    let peer = null;
    let connections = [];
    let hostConn = null;
    let isHost = false;
    let myId = null;
    let controlType = 'desktop';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const keys = {};

    let matchTimer = 300;
    let timerInterval = null;
    let gameOver = false;

    // Upgrades
    let upgradePoints = 0;
    let stats = { damageLvl: 1, speedLvl: 1, healthLvl: 1 };

    // Map platforms
    const platforms = [
      { x: 0, y: 515, w: 1000, h: 35 },     // Ground
      { x: 150, y: 380, w: 220, h: 15 },    // Low Left
      { x: 630, y: 380, w: 220, h: 15 },    // Low Right
      { x: 390, y: 260, w: 220, h: 15 },    // High Mid
      { x: 100, y: 170, w: 180, h: 15 },    // Top Left
      { x: 720, y: 170, w: 180, h: 15 }     // Top Right
    ];

    let gameState = { players: {}, bullets: [] };
    let mousePos = { x: 500, y: 250 };

    function generateShortCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let result = '';
      for (let i = 0; i < 4; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // Window Resize Scaling Logic for Mobile/Desktop
    function resizeCanvas() {
      const container = document.getElementById('game-container');
      const padding = controlType === 'mobile' ? 140 : 80;
      const maxWidth = window.innerWidth - 20;
      const maxHeight = window.innerHeight - padding;

      const aspect = 1000 / 550;
      let width = maxWidth;
      let height = width / aspect;

      if (height > maxHeight) {
        height = maxHeight;
        width = height * aspect;
      }

      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
    }

    window.addEventListener('resize', resizeCanvas);

    // Desktop Input Listeners
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    canvas.addEventListener('mousemove', e => {
      if (controlType !== 'desktop') return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      mousePos.x = (e.clientX - rect.left) * scaleX;
      mousePos.y = (e.clientY - rect.top) * scaleY;
    });

    canvas.addEventListener('mousedown', () => {
      if (controlType === 'desktop') triggerFire();
    });

    // Mobile Touch Joystick & Fire Controls
    const joystickZone = document.getElementById('leftJoystickZone');
    const joystickKnob = document.getElementById('joystickKnob');
    const fireBtn = document.getElementById('fireBtn');

    let joystickTouchId = null;
    let joystickCenter = { x: 0, y: 0 };

    joystickZone.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      joystickTouchId = touch.identifier;
      const rect = joystickZone.getBoundingClientRect();
      joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      handleJoystickMove(touch);
    });

    joystickZone.addEventListener('touchmove', e => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) {
          handleJoystickMove(e.changedTouches[i]);
        }
      }
    });

    const resetJoystick = () => {
      joystickKnob.style.transform = `translate(0px, 0px)`;
      keys['KeyA'] = false;
      keys['KeyD'] = false;
      keys['KeyW'] = false;
      joystickTouchId = null;
    };

    joystickZone.addEventListener('touchend', resetJoystick);
    joystickZone.addEventListener('touchcancel', resetJoystick);

    function handleJoystickMove(touch) {
      const dx = touch.clientX - joystickCenter.x;
      const dy = touch.clientY - joystickCenter.y;
      const dist = Math.min(Math.hypot(dx, dy), 40);
      const angle = Math.atan2(dy, dx);

      const knobX = Math.cos(angle) * dist;
      const knobY = Math.sin(angle) * dist;
      joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

      keys['KeyA'] = dx < -15;
      keys['KeyD'] = dx > 15;
      keys['KeyW'] = dy < -10;

      // Update aim direction on movement
      if (gameState.players[myId]) {
        const me = gameState.players[myId];
        mousePos.x = me.x + (dx * 5);
        mousePos.y = me.y + (dy * 5);
      }
    }

    fireBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      triggerFire();
    });

    function triggerFire() {
      if (!myId || gameOver) return;
      if (isHost) {
        spawnBullet(myId);
      } else if (hostConn && hostConn.open) {
        hostConn.send({ type: 'shoot' });
      }
    }

    function hostGame() {
      isHost = true;
      controlType = document.getElementById('deviceSelect').value;
      const country = document.getElementById('countrySelect').value;
      const shortCode = generateShortCode();
      const fullPeerId = PEER_PREFIX + shortCode;

      document.getElementById('status').innerText = 'Creating room...';
      peer = new Peer(fullPeerId);

      peer.on('open', () => {
        myId = fullPeerId;
        document.getElementById('setup').innerHTML = `
          <h3>Room Created!</h3>
          <p>Share this 4-character code:</p>
          <div class="room-info"><b>${shortCode}</b></div>
          <p style="color:#22c55e;">Waiting for opponent to connect...</p>
          <button onclick="startGameUI()">Start Match</button>
        `;

        gameState.players[myId] = createPlayer(myId, country);
      });

      peer.on('error', () => hostGame());

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => {
          if (data.type === 'join') {
            gameState.players[conn.peer] = createPlayer(conn.peer, data.country, data.stats);
            conn.send({ type: 'init', id: conn.peer });
          }
          if (data.type === 'input' && gameState.players[conn.peer]) {
            const p = gameState.players[conn.peer];
            p.keys = data.keys;
            p.mousePos = data.mousePos;
          }
          if (data.type === 'shoot' && gameState.players[conn.peer]) {
            spawnBullet(conn.peer);
          }
        });
        conn.on('close', () => delete gameState.players[conn.peer]);
      });
    }

    function joinGame() {
      isHost = false;
      controlType = document.getElementById('deviceSelect').value;
      const rawCode = document.getElementById('joinId').value.trim().toUpperCase();
      const country = document.getElementById('countrySelect').value;

      if (rawCode.length !== 4) {
        alert('Please enter a valid 4-character Room Code.');
        return;
      }

      document.getElementById('status').innerText = 'Connecting to room ' + rawCode + '...';
      peer = new Peer();

      peer.on('open', (id) => {
        myId = id;
        hostConn = peer.connect(PEER_PREFIX + rawCode);

        hostConn.on('open', () => {
          hostConn.send({ type: 'join', country, stats });
          startGameUI();
        });

        hostConn.on('data', (data) => {
          if (data.type === 'state') gameState = data.state;
          if (data.type === 'gameEnd') triggerEndGame(data.winner);
        });
      });

      peer.on('error', () => {
        document.getElementById('status').innerText = 'Could not find room code: ' + rawCode;
      });
    }

    function createPlayer(id, country, playerStats = stats) {
      const maxHp = 100 + (playerStats.healthLvl - 1) * 15;
      return {
        id,
        x: 150 + Math.random() * 700,
        y: 100,
        vx: 0,
        vy: 0,
        health: maxHp,
        maxHealth: maxHp,
        kills: 0,
        country: country || '🇳🇬 Player',
        facingLeft: false,
        isFlying: false,
        stats: playerStats,
        keys: {},
        mousePos: { x: 500, y: 250 }
      };
    }

    function spawnBullet(ownerId) {
      const p = gameState.players[ownerId];
      if (!p) return;

      const targetX = ownerId === myId ? mousePos.x : p.mousePos.x;
      const targetY = ownerId === myId ? mousePos.y : p.mousePos.y;
      const angle = Math.atan2(targetY - (p.y - 25), targetX - p.x);
      const baseDmg = 15 + (p.stats.damageLvl - 1) * 2;

      gameState.bullets.push({
        owner: ownerId,
        x: p.x,
        y: p.y - 25,
        damage: baseDmg,
        vx: Math.cos(angle) * 14,
        vy: Math.sin(angle) * 14
      });
    }

    function startGameUI() {
      gameOver = false;
      document.getElementById('setup').style.display = 'none';
      document.getElementById('endScreen').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';

      if (controlType === 'mobile') {
        document.getElementById('touchOverlay').style.display = 'block';
      } else {
        document.getElementById('touchOverlay').style.display = 'none';
      }

      resizeCanvas();

      if (isHost) {
        matchTimer = 300;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (!gameOver) {
            matchTimer--;
            if (matchTimer <= 0) checkWinConditions(true);
          }
        }, 1000);
        setInterval(hostEngineLoop, 1000 / 60);
      } else {
        setInterval(() => {
          if (hostConn && hostConn.open && !gameOver) {
            hostConn.send({ type: 'input', keys, mousePos });
          }
        }, 1000 / 30);
      }

      requestAnimationFrame(renderLoop);
    }

    function checkWinConditions(timeExpired = false) {
      if (gameOver) return;

      let winner = null;
      const players = Object.values(gameState.players);

      players.forEach(p => {
        if (p.kills >= 10) winner = p;
      });

      if (!winner && timeExpired) {
        winner = players.reduce((max, p) => (p.kills > (max ? max.kills : -1) ? p : max), null);
      }

      if (winner || (timeExpired && players.length > 0)) {
        triggerEndGame(winner ? winner.country : 'Nobody');
        if (isHost) {
          connections.forEach(conn => conn.send({ type: 'gameEnd', winner: winner ? winner.country : 'Nobody' }));
        }
      }
    }

    function triggerEndGame(winnerName) {
      gameOver = true;
      clearInterval(timerInterval);

      document.getElementById('game-container').style.display = 'none';
      document.getElementById('endScreen').style.display = 'block';

      const me = gameState.players[myId];
      if (me && me.country === winnerName) {
        upgradePoints += 3;
        document.getElementById('winnerText').innerText = '🎉 VICTORY! Winner: ' + winnerName;
        document.getElementById('winnerText').style.color = '#22c55e';
      } else {
        upgradePoints += 1;
        document.getElementById('winnerText').innerText = '☠️ DEFEAT! Winner: ' + winnerName;
        document.getElementById('winnerText').style.color = '#ef4444';
      }
      updateUpgradeUI();
    }

    function upgradeStat(statName) {
      if (upgradePoints <= 0) return;
      if (statName === 'damage') stats.damageLvl++;
      if (statName === 'speed') stats.speedLvl++;
      if (statName === 'health') stats.healthLvl++;
      upgradePoints--;
      updateUpgradeUI();
    }

    function updateUpgradeUI() {
      document.getElementById('pointsText').innerText = upgradePoints;
      document.getElementById('dmgLvl').innerText = stats.damageLvl;
      document.getElementById('spdLvl').innerText = stats.speedLvl;
      document.getElementById('hpLvl').innerText = stats.healthLvl;
    }

    function restartMatch() {
      if (isHost) {
        Object.keys(gameState.players).forEach(id => {
          const country = gameState.players[id].country;
          const pStats = id === myId ? stats : gameState.players[id].stats;
          gameState.players[id] = createPlayer(id, country, pStats);
        });
        gameState.bullets = [];
        startGameUI();
      } else {
        hostConn.send({ type: 'join', country: gameState.players[myId].country, stats });
        startGameUI();
      }
    }

    function hostEngineLoop() {
      if (gameOver) return;

      if (gameState.players[myId]) {
        gameState.players[myId].keys = keys;
        gameState.players[myId].mousePos = mousePos;
        gameState.players[myId].stats = stats;
      }

      Object.values(gameState.players).forEach(p => {
        const moveSpeed = 4 + (p.stats.speedLvl - 1) * 0.5;

        if (p.keys.KeyA || p.keys.ArrowLeft) p.vx = -moveSpeed;
        else if (p.keys.KeyD || p.keys.ArrowRight) p.vx = moveSpeed;
        else p.vx *= 0.8;

        if (p.keys.KeyW || p.keys.ArrowUp) {
          p.vy -= 0.85;
          p.isFlying = true;
        } else {
          p.isFlying = false;
        }

        p.facingLeft = p.mousePos.x < p.x;
        p.vy += 0.35;

        p.x += p.vx;
        if (p.x < 20) p.x = 20;
        if (p.x > 980) p.x = 980;

        const prevY = p.y;
        p.y += p.vy;

        platforms.forEach(plat => {
          if (
            p.x >= plat.x - 10 &&
            p.x <= plat.x + plat.w + 10 &&
            prevY <= plat.y &&
            p.y >= plat.y
          ) {
            p.y = plat.y;
            p.vy = 0;
          }
        });
      });

      for (let i = gameState.bullets.length - 1; i >= 0; i--) {
        const b = gameState.bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        let removed = false;

        platforms.forEach(plat => {
          if (b.x >= plat.x && b.x <= plat.x + plat.w && b.y >= plat.y && b.y <= plat.y + plat.h) {
            gameState.bullets.splice(i, 1);
            removed = true;
          }
        });

        if (!removed) {
          Object.values(gameState.players).forEach(p => {
            if (!removed && p.id !== b.owner) {
              const dist = Math.hypot(p.x - b.x, (p.y - 25) - b.y);
              if (dist < 22) {
                p.health -= b.damage;
                if (p.health <= 0) {
                  p.health = p.maxHealth;
                  p.x = 150 + Math.random() * 700;
                  p.y = 100;

                  if (gameState.players[b.owner]) {
                    gameState.players[b.owner].kills++;
                    checkWinConditions();
                  }
                }
                gameState.bullets.splice(i, 1);
                removed = true;
              }
            }
          });
        }

        if (!removed && (b.x < 0 || b.x > 1000 || b.y < 0 || b.y > 550)) {
          gameState.bullets.splice(i, 1);
        }
      }

      connections.forEach(conn => {
        if (conn.open) conn.send({ type: 'state', state: gameState });
      });
    }

    function renderLoop() {
      if (gameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      platforms.forEach((plat, idx) => {
        ctx.fillStyle = idx === 0 ? '#1e293b' : '#334155';
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        ctx.fillStyle = idx === 0 ? '#3b82f6' : '#10b981';
        ctx.fillRect(plat.x, plat.y, plat.w, 3);
      });

      ctx.fillStyle = '#facc15';
      gameState.bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      Object.values(gameState.players).forEach(p => drawStickman(p));

      const mins = Math.floor(matchTimer / 60).toString().padStart(2, '0');
      const secs = (matchTimer % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `Time: ${mins}:${secs}`;

      const me = gameState.players[myId];
      if (me) {
        document.getElementById('scoreDisplay').innerText = `Kills: ${me.kills} / 10`;
      }

      requestAnimationFrame(renderLoop);
    }

    function drawStickman(p) {
      ctx.save();
      ctx.translate(p.x, p.y);

      ctx.fillStyle = '#334155';
      ctx.fillRect(-20, -65, 40, 6);
      ctx.fillStyle = p.health > (p.maxHealth * 0.4) ? '#22c55e' : '#ef4444';
      ctx.fillRect(-20, -65, (p.health / p.maxHealth) * 40, 6);

      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`${p.country} (${p.kills}K)`, 0, -45);

      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, -30, 10, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(0, 0);
      ctx.moveTo(0, 0);
      ctx.lineTo(-10, 15);
      ctx.moveTo(0, 0);
      ctx.lineTo(10, 15);
      ctx.stroke();

      if (p.isFlying) {
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(-5, -5);
        ctx.lineTo(0, 12 + Math.random() * 6);
        ctx.lineTo(5, -5);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.moveTo(0, -15);
      const armLength = 16;
      const angle = p.facingLeft ? Math.PI : 0;
      ctx.lineTo(Math.cos(angle) * armLength, -15 + Math.sin(angle) * armLength);
      ctx.stroke();

      ctx.restore();
    }
  </script>
</body>
</html>
